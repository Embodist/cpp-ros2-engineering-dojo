name: dojo-compile-smoke
on: [push, pull_request]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build scaffolds
        run: cmake --build build --parallel 2
      - name: Smoke check (student tests intentionally FAIL until solved)
        run: ctest --test-dir build -R '^dojo_smoke$' --output-on-failure
