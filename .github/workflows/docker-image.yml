name: docker-image

on:
  push:
    branches: [main, master]
    paths:
      - "docker/**"
      - "!docker/README.md"
      - "!docker/IMAGE.md"
      - "!docker/.env.example"
      - "!docker/vendor/README.md"
      - ".github/workflows/docker-image.yml"
  pull_request:
    paths:
      - "docker/**"
      - "!docker/README.md"
      - "!docker/IMAGE.md"
      - "!docker/.env.example"
      - "!docker/vendor/README.md"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: main
            dockerfile: Dockerfile
            tag: latest
            sha_tag: sha
          - name: vscode
            dockerfile: Dockerfile.vscode
            tag: vscode
            sha_tag: vscode-sha
    concurrency:
      group: docker-image-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h

      - name: Scan vendored config for secrets
        run: |
          if grep -RIlE 'sk-[A-Za-z0-9]{20,}' docker/vendor; then
            echo "::error::Possible secret in docker/vendor"
            exit 1
          fi
          if find docker/vendor \( -name auth.json -o -name '.env' \) | grep -q .; then
            echo "::error::auth.json/.env found in docker/vendor"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: docker/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ matrix.tag }}
            ${{ steps.image.outputs.name }}:${{ matrix.sha_tag }}-${{ github.sha }}
          build-contexts: |
            nvim-config=${{ github.workspace }}/docker/vendor/nvim
            pi-config=${{ github.workspace }}/docker/vendor/pi
          build-args: |
            APT_MIRROR=
            INSTALL_PLUGINS=1
            INSTALL_MASON=1
            INSTALL_PREVIEW_DEPS=1
            INSTALL_ROBOTICS_LIBS=0
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=min,scope=${{ matrix.name }}

      - name: Push to Aliyun ACR (optional)
        if: vars.ACR_ENABLED == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ matrix.tag }}
        run: |
          printf '%s' "$ACR_PASSWORD" | docker login \
            --username "$ACR_USERNAME" --password-stdin \
            registry.cn-chengdu.aliyuncs.com
          docker pull "$IMAGE:$TAG"
          docker tag "$IMAGE:$TAG" "registry.cn-chengdu.aliyuncs.com/rapid7/cpp-ros2-engineering-dojo:$TAG"
          docker push "registry.cn-chengdu.aliyuncs.com/rapid7/cpp-ros2-engineering-dojo:$TAG"

      - name: Make GHCR package public
        if: matrix.name == 'main' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${{ github.repository_owner }}"
          pkg="${{ github.event.repository.name }}"
          gh api -X PATCH "/orgs/$owner/packages/container/$pkg/visibility" -f visibility=public \
            || gh api -X PATCH "/user/packages/container/$pkg/visibility" -f visibility=public \
            || echo "::warning::Set package visibility to public in Package settings."

  # plus 版本：只在 base 推送后在线构建，FROM 同一 commit 的 base，不本地 build。
  build-plus:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: docker-image-plus-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push plus
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: docker/Dockerfile.plus
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:plus
            ${{ steps.image.outputs.name }}:plus-sha-${{ github.sha }}
          build-args: |
            BASE_IMAGE=${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=plus
          cache-to: type=gha,mode=min,scope=plus

      - name: Push plus to Aliyun ACR (optional)
        if: vars.ACR_ENABLED == 'true'
        continue-on-error: true
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          printf '%s' "$ACR_PASSWORD" | docker login \
            --username "$ACR_USERNAME" --password-stdin \
            registry.cn-chengdu.aliyuncs.com
          docker pull "$IMAGE:plus"
          docker tag "$IMAGE:plus" "registry.cn-chengdu.aliyuncs.com/rapid7/cpp-ros2-engineering-dojo:plus"
          docker push "registry.cn-chengdu.aliyuncs.com/rapid7/cpp-ros2-engineering-dojo:plus"
